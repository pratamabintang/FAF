# ==============================================================================
# FAF Experiment Configuration - Stage 12: Unimodal Baseline (RGB Only on dataset_1V2)
# Modality: RGB (3-Channel)
# Evaluates optical imagery performance alone with blacklist filtering & augmentations
# ==============================================================================

# --- 1. Experiment & Logging Metadata ---
exp_name: "12_baseline_v2_rgb_only"
exp_dir: "runs"
log_interval: 10
verbose: true
use_wandb: false

# --- 2. Determinism & Reproducibility ---
seed: 42
deterministic: false
benchmark: true

# --- 3. Hardware & System Configuration ---
gpu: 0
multi_gpu: false
num_workers: 4
grad_accum_steps: 1

# --- 4. Dataset Configuration (LandslideDatasetV2: RGB Only) ---
dataset: "landslide_v2"
data_root: "./dataset/dataset_1V2"
train_source: "train"
val_source: "val"
img_height: 512
img_width: 512
num_classes: 2                          # 0: Background, 1: Landslide
ignore_unlabeled: false

# Channel Selection & Blacklist Options
channels: ["rgb"]                       # RGB optical channels only
apply_blacklist: true                   # Skip noisy tiles listed in black_list.txt
blacklist_path: "dataset/dataset_1V2/black_list.txt"
ignore_rgb_black: true                  # Mask RGB(0,0,0) void pixels with ignore_index (-100)
ignore_index: -100

# Sampling & Cropping
positive_aware_sampling: true           # Centers crop around landslide pixels
positive_sample_prob: 0.5               # Probability of positive-centered crop
positive_aware_sampler: false           # Dataset-level WeightedRandomSampler

# --- 5. Model Architecture & Modality Operating Mode ---
rgb_arch: "convnextv2_tiny.fcmae_ft_in22k_in1k_384"
ir_arch: "convnextv2_tiny.fcmae_ft_in22k_in1k_384"
context_dim: "[96,192,384,768]"
modal_mode: "rgb_only"                  # Dedicated unimodal RGB mode (ir_encoder is inactive)
freeze_backbones: false

# Decoder & Attention Modules
decoder_type: "panet"                   # Options: "fpn" | "panet"
deep_supervision: true
enhanced_fusion: false
use_safd: false                         # Disabled for unimodal
use_cafg: false                         # Disabled for unimodal
use_tpsw: false                         # Disabled for unimodal

# --- 6. Optimization, Scheduler & Loss Functions ---
epochs: 100
batch_size: 4
optimizer: "adamw"
lr_backbone: 3.0e-5
lr_fusion: 3.0e-4
learning_rate: 3.0e-4
weight_decay: 0.01
layer_decay: 0.90
scheduler: "cosine"
min_lr: 1.0e-6
warmup_epochs: 5

loss_type: "combo3"                     # CE + Dice + Lovasz
ce_weight: 0.4
dice_weight: 0.3
lovasz_weight: 0.3
class_weights: true
class_weight_multiplier: 10.0

# Auxiliary Loss (Deep Supervision)
aux_weight_start: 0.3
aux_weight_end: 0.05
aux_weight_decay_epoch: 80

# --- 7. Regularization, EMA & Evaluation ---
ema: true
ema_decay: 0.999
eval_use_ema: true
eval_interval: 1
save_interval: 5
early_stopping: false
patience: 15
min_delta: 0.001
save_best_metric: "miou"
save_top_k: 3
metric_types: ["miou", "f1", "precision", "recall"]
