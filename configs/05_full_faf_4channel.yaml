# ==============================================================================
# FAF Experiment Configuration - Stage 5: Full FAF + 4-Channel Topographic Derivatives (Slope + Sin/Cos Aspect)
# ==============================================================================


# --- 1. Experiment & Logging Metadata ---
exp_name: "05_full_faf_4channel"
exp_dir: "Experiments"
log_interval: 10
verbose: true
use_wandb: false

# --- 2. Determinism & Reproducibility ---
seed: 42
deterministic: false                    # Set true for bit-exact reproducible runs
benchmark: true                         # Set true for faster training throughput

# --- 3. Hardware & System Configuration (Optimized for RTX 2060 Super 8GB) ---
gpu: 0
multi_gpu: false
num_workers: 4                          # Parallel CPU workers for DataLoader
grad_accum_steps: 1                     # Direct step per batch

# --- 4. Dataset Configuration (Landslide Multimodal: RGB + DTM) ---
dataset: "landslide"                    # Options: "landslide" (2 classes) | "mfnet" (9 classes) | "pst900" (5 classes)
data_root: "./dataset/dataset_1"
train_source: "train"
img_height: 512                         # Native resolution of dataset_1 (512x512, no aspect distortion)
img_width: 512
num_classes: 2                          # 0: Background, 1: Landslide
ignore_unlabeled: false

# DTM Elevation Normalization Statistics (Calibrated on dataset_1 train split)
dtm_norm: "standard"                    # Options: "standard" | "minmax" | "none"
dtm_mean: 72.82                         # Empirical mean elevation (meters)
dtm_std: 58.01                          # Empirical std elevation (meters)

# Topographic Derivatives & Sampling Configuration
include_derivatives: true              # If true, computes [DTM, Slope, Sin(Aspect), Cos(Aspect)] (4 channels)
pixel_scale: 1.0                        # Physical spatial resolution (meters/pixel)
ignore_nodata: true                     # Labels invalid DTM NoData regions with ignore_index (-100)
positive_aware_sampling: true           # Enables balanced crop centering on positive landslide areas
positive_sample_prob: 0.5               # Probability of sampling positive landslide region during crop
positive_aware_sampler: false           # Dataset-level WeightedRandomSampler prioritizing landslide samples

# --- 5. Model Architecture & Novel Multimodal Modules ---
# Backbone choices:
#   - Nano: "convnextv2_nano.fcmae_ft_in22k_in1k_384" -> context_dim: "[80,160,320,640]"
#   - Tiny: "convnextv2_tiny.fcmae_ft_in22k_in1k_384" -> context_dim: "[96,192,384,768]"
#   - Base: "convnextv2_base.fcmae_ft_in22k_in1k_384" -> context_dim: "[128,256,512,1024]"
rgb_arch: "convnextv2_tiny.fcmae_ft_in22k_in1k_384"
ir_arch: "convnextv2_tiny.fcmae_ft_in22k_in1k_384"
context_dim: "[96,192,384,768]"
freeze_backbones: false

# Decoder & Novel Attention Modules
decoder_type: "panet"                  # Options: "fpn" | "panet"
deep_supervision: true
enhanced_fusion: false
use_safd: true                        # Scene-Adaptive Frequency Decomposition (Novel)
use_cafg: true                        # Complementarity-Aware Fusion Gate (Novel)
use_tpsw: true                        # Thermal/Terrain Prior-Guided Spatial Weighting (Novel)

# Pretrained weights / Checkpoint Resume
rgb_model_path: ""
ir_model_path: ""
resume: false
resume_with_reset: false
resume_from: ""

# --- 6. Training & Optimization ---
epochs: 300
batch_size: 4                          # 4 samples per batch
optimizer: "adamw"                     # Options: "adamw" | "sgd"
lr_backbone: 0.00003                   # 3e-5 (fine-tuning pretrained backbone)
lr_fusion: 0.0003                      # 3e-4
lr_decoder: 0.0003                     # 3e-4
weight_decay: 0.01
clip_grad: 0.1

# Learning Rate Scheduler
scheduler: "cosine_warmup"             # Options: "cosine_warmup" | "cosine" | "poly" | "step" | "plateau" | "none"
warmup_epochs: 10
t0: 50
step_size: 45

# --- 7. Loss Functions & Extreme Class Imbalance Mitigation ---
loss_type: "combo3"                # Options: "combo3" | "combo_ohem" (CE + Dice + Lovasz + OHEM + Boundary)
ce_weight: 0.35
dice_weight: 0.35
lovasz_weight: 0.30
label_smoothing: 0.0
class_weights: true                    # Dynamic inverse frequency weighting (~98% BG vs ~2% Landslide)
class_weight_multiplier: 10.0

# Auxiliary Loss
aux_weight_start: 0.3
aux_weight_end: 0.05
aux_weight_decay_epoch: 80

# Hard Example Mining & Boundary Loss
ohem_weight: 0.1
boundary_weight: 0.1
ohem_thresh: 0.7
ohem_min_kept: 50000
focal_weight: 0.5                      # Focal loss weighting for rare landslide features
focal_gamma: 2.0
focal_target_class: 1                  # 1 = Landslide positive class

# --- 8. Evaluation & EMA (Exponential Moving Average) ---
ema: true
ema_decay: 0.999
eval_use_ema: true
